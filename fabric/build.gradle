plugins {
	id "net.fabricmc.fabric-loom"
	id "maven-publish"
	id "com.gradleup.shadow" version "8.3.6"
}

group = rootProject.maven_group
version = rootProject.mod_version

base {
	archivesName = "music-player-extended-fabric"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

configurations {
	shade
	implementation.extendsFrom shade
}

loom {
	accessWidenerPath = file("src/main/resources/musicplayer.accesswidener")

	runs {
		client {
			runDir "run/client"
			property "musicplayer.dev", getRootProject().lavaplayerLibraries()
			ideConfigGenerated true
		}

		server {
			runDir "run/server"
			ideConfigGenerated true
		}
	}
}

evaluationDependsOn(":musicplayer-lavaplayer")

afterEvaluate {
	net.fabricmc.loom.task.LoomTasks.getIDELaunchConfigureTaskName(project).get().configure {
		dependsOn project(":musicplayer-lavaplayer").tasks.named("assemble")
	}
}



processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	doLast {
		fileTree(dir: outputs.files.asPath, include: "**/*.json").each { File file ->
			file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
		}
	}
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
	maven {
		name = "Wisp Forest"
		url = "https://maven.wispforest.io"
	}
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Aridge"
		url = "https://maven.arbjerg.dev/releases"
	}
	maven {
		name = "Topi Maven"
		url = "https://maven.topi.wtf/releases"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	mavenCentral()
}

dependencies {
	// Minecraft - NO mappings needed for 26.1+ (unobfuscated)
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric Loader and API
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// owo-lib - Jar-in-Jar (bundled into the final jar)
	implementation "io.wispforest:owo-lib:${project.owo_version}"
	include "io.wispforest:owo-lib:${project.owo_version}"

	// YACL - Jar-in-Jar (bundled into the final jar)
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	include "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Mod Menu (dev environment only)
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Lavaplayer API - compileOnly (bundled via shadowJar)
	compileOnly project(":musicplayer-lavaplayer-api")

	// AppDirs (bundled into the final jar natively)
	implementation "net.harawata:appdirs:1.4.0"
	include "net.harawata:appdirs:1.4.0"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	dependsOn project(":musicplayer-lavaplayer-api").tasks.named("assemble")
	dependsOn project(":musicplayer-lavaplayer").tasks.named("assemble")

	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
	
	from project(":musicplayer-lavaplayer").file("src/main/resources/LICENSE-DEPENDENCIES")

	doFirst {
		from project(":musicplayer-lavaplayer-api").sourceSets.main.output
	}

	into("dependencies") {
		final def buildDir = project(":musicplayer-lavaplayer").layout.buildDirectory
		from buildDir.dir("libs").get().file("musicplayer-lavaplayer.jar.packed")
		from buildDir.dir("dependencies")
	}

}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}
}


